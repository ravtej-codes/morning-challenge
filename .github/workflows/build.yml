name: Build unsigned IPA

on:
  push:
    branches: [main]
    paths-ignore: ["backend/**", "*.md"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (no signing — Sideloadly signs it)
        run: |
          xcodebuild build \
            -project MorningChallenge.xcodeproj \
            -scheme MorningChallenge \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/MorningChallenge.app Payload/
          zip -qry MorningChallenge.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: MorningChallenge-ipa
          path: MorningChallenge.ipa
          retention-days: 30
