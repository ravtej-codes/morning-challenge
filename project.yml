name: MorningChallenge
options:
  bundleIdPrefix: com.sunny
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MorningChallenge:
    type: application
    platform: iOS
    info:
      path: App/Info.plist
      properties:
        NSAlarmKitUsageDescription: "Rings an alarm when it's time to start your morning activity, even in Sleep or Work Focus."
    sources:
      - App/Sources
      - path: App/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunny.morningchallenge
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Morning
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
